[project]
name = "ayabot-backend"
version = "0.1.0"
description = "Multi-tenant AYABOT API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false
